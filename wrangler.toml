# Cloudflare Pages 项目配置（wrangler pages deploy / Pages Git 集成都用这份）
name = "personal-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# 访客计数用 KV（已创建，id 已填好）：
#   npx wrangler kv namespace create VISITS   # 创建（已存在时会报 already exists）
#   npx wrangler kv namespace list            # 查看 id
#
# ⚠️ 这个文件是 Pages 项目的「唯一事实来源」：一旦仓库里存在它，
#    控制台里对应字段会变为只读，改绑定要改这里再部署。
#    若你已在控制台配过设置，先执行：npx wrangler pages download config personal-site
#
# ⚠️ 不想持久化计数？把下面整段 [[kv_namespaces]] 删掉即可，
#    /api/visit 会退化为单实例内存计数（网站功能正常，数字会归零）。
[[kv_namespaces]]
binding = "VISITS"
id = "6636d926f3164259bb5955623a736a32"

# 留言板（/api/guestbook）默认复用上面这个 VISITS 命名空间 —— 键前缀不同
# （gbp/ gbx/ gbidx/ gbcount/ gbrl/），不会和访客计数的 count 撞。
# 想分开管，就再建一个命名空间并解开下面这段：
#
#   npx wrangler kv namespace create GUESTBOOK
#
# [[kv_namespaces]]
# binding = "GUESTBOOK"
# id = "<新建后的 id>"
#
# 三个可选环境变量（用 wrangler pages secret put 配置，不写在这里）：
#   GUESTBOOK_SALT   派生访客指纹的盐；不配则用开发默认值，上线前必须配，配了别换
#   GUESTBOOK_EMAIL  私信收件邮箱（多个用逗号分隔）—— 邮件通道
#   RESEND_API_KEY   Resend 的 key（三个 secret 之外，按需另配）
#   GUESTBOOK_PUSH   私信手机推送地址（Bark / Server酱 / 任意收 JSON 的端点）
#   GUESTBOOK_ADMIN  管理口令：?key=... 可读私信、可删留言；不配则管理接口全部 403
