# Cloudflare Pages 项目配置（wrangler pages deploy / Pages Git 集成都用这份）
name = "personal-site"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# 访客计数用 KV（已创建，id 已填好）：
#   npx wrangler kv namespace create VISITS   # 创建（已存在时会报 already exists）
#   npx wrangler kv namespace list            # 查看 id
#
# ⚠️ 这个文件是 Pages 项目的「唯一事实来源」：一旦仓库里存在它，
#    控制台里对应字段会变为只读，改绑定要改这里再部署。
#    若你已在控制台配过设置，先执行：npx wrangler pages download config personal-site
#
# ⚠️ 不想持久化计数？把下面整段 [[kv_namespaces]] 删掉即可，
#    /api/visit 会退化为单实例内存计数（网站功能正常，数字会归零）。
[[kv_namespaces]]
binding = "VISITS"
id = "6636d926f3164259bb5955623a736a32"
