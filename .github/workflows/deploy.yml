name: deploy

on:
  # 推送即构建；部署在 secrets 配好后会自动执行，未配置时自动跳过（CI 仍为绿）
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成演示素材（若仓库里已提交素材，可删掉这一步）
        run: npm run gen:assets

      - name: 构建静态产物
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ---- Cloudflare Pages 部署：实现"推送即部署" ----
  # 为什么走 Actions 而不是 Pages 的 Git 集成：本项目是用 wrangler 直传创建的
  # Direct Upload 项目，Cloudflare 不允许把它的 source 改成 Git（API 会报
  # "You cannot update the source object in a Direct Uploads project"）。
  #
  # 一次配置，之后推送即部署（配好前这一步自动跳过，CI 不会红）：
  #   仓库 Settings → Secrets and variables → Actions → New repository secret
  #     CLOUDFLARE_API_TOKEN = 一枚权限为 Account → Cloudflare Pages → Edit 的 API Token
  #     CLOUDFLARE_ACCOUNT_ID = 92d5d12e48bb0bd92f08f35da8628b59
  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 推送到 Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'personal-site' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 未配置 secrets 时的提示
        if: ${{ env.CF_API_TOKEN == '' }}
        run: echo "::notice::尚未配置 CLOUDFLARE_API_TOKEN，已跳过部署；构建产物见本页 Artifacts"

  # ---- 备用出口：香港 / 境外 VPS（不备案方案下国内直连更稳）----
  # 需要：vars.ENABLE_VPS = 'true'，secrets.DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
  deploy-vps:
    needs: build
    if: ${{ vars.ENABLE_VPS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步静态文件
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ vars.DEPLOY_PORT || 22 }} -i ~/.ssh/id_ed25519" \
            ./dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH || '/var/www/personal-site' }}/"

      - name: 重启 Node 出口（可选）
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || 22 }}" -i ~/.ssh/id_ed25519 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo systemctl restart personal-site || true"
